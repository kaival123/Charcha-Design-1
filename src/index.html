<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Charchalive</title>
  <meta name="description" content="Charchalive — curated content from authentic sources, with perspectives rather than prejudices.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply saved theme and palette before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var c = JSON.parse(localStorage.getItem('brand-colours') || 'null');
      if (c && c.vars) {
        for (var k in c.vars) {
          if (/^--brand-[a-z-]+$/.test(k) && /^#[0-9a-f]{6}$/i.test(c.vars[k])) {
            document.documentElement.style.setProperty(k, c.vars[k]);
          }
        }
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>

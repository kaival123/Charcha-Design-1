    SeoService (src/app/seo) rewrites these in place for each route, so there are no duplicates.
  -->

  <meta name="description" content="Charcha Live curates content from authentic sources with unique context, from Rajneeti and jurisprudence to the economy, travel, food and fitness.">

  <meta property="og:type" content="website">

  <meta property="og:url" content="https://charchalive.com/about">

  <!-- Site-wide structured data. Per-page JSON-LD (WebPage, BreadcrumbList, Person) is added by SeoService. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://charchalive.com/#organization",
        "name": "Charcha Live",
        "alternateName": "Charchalive",
        "url": "https://charchalive.com/",
        "logo": "https://charchalive.com/images/logo.png",
        "slogan": "Potato Chips To Micro Chips."
      },
      {
        "@type": "WebSite",
        "@id": "https://charchalive.com/#website",
        "url": "https://charchalive.com/",
        "name": "Charcha Live",
        "alternateName": "Charchalive",
        "inLanguage": "en-IN",
        "publisher": { "@id": "https://charchalive.com/#organization" }
      }
    ]
  }
  </script>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply saved theme and palette before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var c = JSON.parse(localStorage.getItem('brand-colours') || 'null');
      if (c && c.vars) {
        for (var k in c.vars) {
          if (/^--brand-[a-z-]+$/.test(k) && /^#[0-9a-f]{6}$/i.test(c.vars[k])) {
            document.documentElement.style.setProperty(k, c.vars[k]);
          }
        }
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

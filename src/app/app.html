<!-- Slim strip above the header; it scrolls away while the header below stays pinned. -->
<div class="top-strip">
  <div class="container strip-inner">
    <span class="strip-tagline">{{ site.tagline }}</span>
    <a [href]="'mailto:' + site.email">{{ site.email }}</a>
  </div>
</div>

<header class="site-header" [class.scrolled]="scrolled()">
  <div class="container bar">
    <a class="brand" routerLink="/about" (click)="menuOpen.set(false)" aria-label="Charchalive home">
      <app-brand-words />
      <img src="images/logo.png" alt="" width="52" height="52" />
      <span class="wordmark visibility_hidden">Charcha live 
        <!-- <span>live</span> -->
      </span>
    </a>

    <nav id="site-nav" [class.open]="menuOpen()" aria-label="Main">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="menuOpen.set(false)"
          >{{ item.label }}</a
        >
      }
      <a class="btn nav-cta" routerLink="/contact" (click)="menuOpen.set(false)">
        Share your story <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <div class="bar-actions">
      <a class="btn btn-sm header-cta" routerLink="/contact">Share your story</a>
      <app-palette-picker />

      <button
        class="theme-toggle"
        type="button"
        [attr.aria-label]="themeLabels[themes.theme()] + ' (click to change)'"
        [title]="themeLabels[themes.theme()]"
        (click)="themes.cycle()"
      >
        @switch (themes.theme()) {
          @case ('light') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
          }
          @case ('dark') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="4" width="20" height="13" rx="2" />
              <path d="M8 21h8M12 17v4" />
            </svg>
          }
        }
      </button>

      <button
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="site-nav"
        aria-label="Toggle navigation"
        (click)="menuOpen.set(!menuOpen())"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<app-site-footer />

<button
  class="back-to-top-button"
  type="button"
  [class.visible]="showTop()"
  aria-label="Back to top"
  title="Back to top"
  [attr.tabindex]="showTop() ? 0 : -1"
  (click)="scrollToTop()"
>
  <svg class="back-to-top-button__progress" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="20" pathLength="100" [attr.stroke-dasharray]="scrollProgress() + ' 100'" />
  </svg>
  <svg class="back-to-top-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
</button>

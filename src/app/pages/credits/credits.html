<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Photo Credits</span>
    <h1>With thanks to the photographers</h1>
    <p class="lead">
      Photographs on this site are sourced from Wikimedia Commons and used under the licences listed below.
    </p>
  </div>
</section>

<section class="section">
  <div class="container list">
    @for (p of photos; track p.src) {
      <article class="credit">
        <img [src]="p.src" [alt]="p.alt" width="160" height="120" loading="lazy" />
        <div>
          <h3><a [href]="p.source" target="_blank" rel="noopener">{{ p.title }}</a></h3>
          <p>{{ p.author }} · <span class="license">{{ p.license }}</span></p>
        </div>
      </article>
    }
  </div>
</section>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="164 96 688 500" role="img" aria-label="Line drawing of two young people talking at a café table with coffee, books and flowers">
  <style>
    .o  { fill: #FAF7F2; stroke: #1F3A5F; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .l  { fill: none; stroke: #1F3A5F; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .f  { fill: none; stroke: #1F3A5F; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

    .anim { transform-box: fill-box; }
    .mForearm { transform-origin: 6% 70%; animation: gesture 8s ease-in-out infinite; }
    .wForearm { transform-origin: 70% 92%; animation: sip 8s ease-in-out infinite; }
    .mHead { transform-origin: 30% 95%; animation: talkHead 8s ease-in-out infinite; }
    .wHead { transform-origin: 30% 95%; animation: talkHead 8s ease-in-out infinite; animation-delay: -4s; }
    .breathe { transform-origin: 50% 100%; animation: breathe 4s ease-in-out infinite; }
    .w .breathe { animation-delay: -1.7s; }
    .steam { animation: steam 3s ease-in-out infinite; }
    .steam2 { animation-delay: -1.5s; }
    .flowers { transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; }

    @keyframes gesture {
      0%,48%,100% { transform: rotate(0); }
      8% { transform: rotate(-16deg); } 16% { transform: rotate(-4deg); }
      26% { transform: rotate(-20deg); } 38% { transform: rotate(-3deg); }
    }
    @keyframes sip {
      0%,46%,100% { transform: rotate(0); }
      56%,90% { transform: rotate(14deg); }
    }
    @keyframes talkHead {
      0%,48%,100% { transform: rotate(0); }
      10% { transform: rotate(-2deg); } 24% { transform: rotate(1.5deg); } 36% { transform: rotate(-1.5deg); }
      58% { transform: rotate(4deg); } 64% { transform: rotate(0); }
      78% { transform: rotate(4deg); } 84% { transform: rotate(0); }
    }
    @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.01); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(5px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
    @keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>


  <defs>
    <!-- Makes the white areas transparent and colours the lines.
         To change the line colour, edit flood-color below (e.g. #FFFFFF for white lines). -->
    
  </defs>
  <g>
  

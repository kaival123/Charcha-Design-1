<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-label="Animated line drawing of an open ancient book resting on a lotus, with a glowing flame of knowledge rising from it">
  <style>
    .ln { fill: none; stroke: #1F3A5F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .th { fill: none; stroke: #1F3A5F; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .pg { fill: #FAF7F2; stroke: #1F3A5F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .pt { fill: #FBE9E4; stroke: #1F3A5F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .flame { fill: #F3D94A; stroke: #C0392B; stroke-width: 2.4; stroke-linejoin: round; }
    .core { fill: #C0392B; opacity: .85; }
    .halo { fill: #F3D94A; }
    .ray { stroke: #C9A227; stroke-width: 1.6; stroke-linecap: round; }
    .gold { fill: #F3D94A; }

    .rays { transform-origin: 250px 180px; animation: spin 40s linear infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: glow 3s ease-in-out infinite; }
    .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
    .in { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.1s ease-in-out infinite reverse; }
    .petal { transform-box: fill-box; transform-origin: 50% 100%; animation: bloom 4s ease-in-out infinite; }
    .p2 { animation-delay: -.5s; }
    .p3 { animation-delay: -1s; }
    .book { animation: hover 5s ease-in-out infinite; }
    .page { transform-box: fill-box; animation: turn 6s ease-in-out infinite; }
    .page.r { transform-origin: 0 50%; }
    .page.l { transform-origin: 100% 50%; }
    .spark { animation: rise 4.5s ease-in infinite; opacity: 0; }
    .s2 { animation-delay: 1.1s; animation-duration: 5.2s; }
    .s3 { animation-delay: 2.2s; animation-duration: 4.8s; }
    .s4 { animation-delay: 3.3s; animation-duration: 5.6s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow { 0%, 100% { opacity: .18; transform: scale(.92); } 50% { opacity: .38; transform: scale(1.1); } }
    @keyframes flicker { 0%, 100% { transform: scale(1, 1) skewX(0); } 25% { transform: scale(.94, 1.07) skewX(3deg); } 50% { transform: scale(1.04, .95) skewX(-2deg); } 75% { transform: scale(.97, 1.05) skewX(2deg); } }
    @keyframes bloom { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.07); } }
    @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes turn { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.94); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-110px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .spark { opacity: .6; } }
  </style>

  <!-- rotating mandala rays and breathing halo behind the flame -->
  <circle class="halo" cx="250" cy="180" r="64"/>
  <g class="rays">
    <g class="ray">
      <line x1="250" y1="92" x2="250" y2="74"/><line x1="250" y1="268" x2="250" y2="286"/>
      <line x1="162" y1="180" x2="144" y2="180"/><line x1="338" y1="180" x2="356" y2="180"/>
      <line x1="188" y1="118" x2="175" y2="105"/><line x1="312" y1="118" x2="325" y2="105"/>
      <line x1="188" y1="242" x2="175" y2="255"/><line x1="312" y1="242" x2="325" y2="255"/>
    </g>
  </g>
  <circle class="th" cx="250" cy="180" r="76" stroke-dasharray="2 7"/>

  <!-- lotus -->
  <g>
    <path class="pt petal p3" d="M250 358 Q190 362 160 334 Q210 328 250 358 Z"/>
    <path class="pt petal p3" d="M250 358 Q310 362 340 334 Q290 328 250 358 Z"/>
    <path class="pt petal p2" d="M250 358 Q212 352 196 320 Q234 326 250 358 Z"/>
    <path class="pt petal p2" d="M250 358 Q288 352 304 320 Q266 326 250 358 Z"/>
    <path class="pt petal" d="M250 358 Q230 336 250 306 Q270 336 250 358 Z"/>
  </g>

  <!-- open book -->
  <g class="book">
    <path class="pg" d="M138 288 Q205 278 250 300 Q295 278 362 288 V298 Q295 288 250 310 Q205 288 138 298 Z"/>
    <path class="pg page l" d="M250 292 Q205 272 150 282 V222 Q205 212 250 232 Z"/>
    <path class="pg page r" d="M250 292 Q295 272 350 282 V222 Q295 212 250 232 Z"/>
    <path class="th" d="M168 240 Q205 234 236 248 M168 252 Q205 246 236 260 M168 264 Q205 258 236 272"/>
    <path class="th" d="M332 240 Q295 234 264 248 M332 252 Q295 246 264 260 M332 264 Q295 258 264 272"/>
    <path class="ln" d="M250 232 V292"/>
  </g>

  <!-- flame of knowledge -->
  <g class="fl">
    <path class="flame" d="M250 128 Q226 166 236 196 Q250 218 264 196 Q274 166 250 128 Z"/>
  </g>
  <g class="in">
    <path class="core" d="M250 160 Q240 182 245 196 Q250 205 255 196 Q260 182 250 160 Z"/>
  </g>

  <!-- rising sparks -->
  <circle class="spark gold" cx="214" cy="150" r="3.2"/>
  <circle class="spark s2 gold" cx="292" cy="140" r="2.8"/>
  <circle class="spark s3 gold" cx="236" cy="124" r="2.4"/>
  <circle class="spark s4 gold" cx="270" cy="118" r="3"/>
</svg>
